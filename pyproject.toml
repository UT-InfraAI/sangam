[project]
name = "sangam"
version = "0.1.0"
description = "An efficient serving system for diffusion language models (dLLMs)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nitin Kedia", email = "nitinkedia7@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "flashinfer-cubin==0.6.3",
    "flashinfer-jit-cache==0.6.3+cu128",
    "flashinfer-python==0.6.3",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "ddsketch==3.0.1",
    "seaborn==0.13.2",
    "torch==2.8.0",
    "transformers==4.57.3",
    "grpcio==1.80.0",
    "protobuf==6.33.5",
    "torch-c-dlpack-ext==0.1.5",
    "pyarrow==24.0.0",
]

[project.scripts]
sangam = "sangam.entrypoints.launch:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools==1.78.1",
    "ipykernel==6.30.1",
    "mypy-protobuf==5.0.0",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
    "py-spy==0.4.2",
    "pytest==9.0.2",
    "ruff==0.14.0",
]

[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer" }

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/cu128"

[tool.pytest.ini_options]
markers = [
    "gpu: tests that require CUDA GPUs and NCCL setup",
]

[tool.ruff]
extend-exclude = [
    "src/sangam/proto/sangam_pb2.py",
    "src/sangam/proto/sangam_pb2.pyi",
    "src/sangam/proto/sangam_pb2_grpc.py",
    "src/sangam/proto/sangam_pb2_grpc.pyi",
]
