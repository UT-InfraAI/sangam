syntax = "proto3";

package sangam;

// ---------------------------------------------------------------------------
// Scheduler Service — accepts client requests. Bound to the client port. The
// long-lived Generate RPC parks one server pool thread per in-flight call,
// so high benchmark concurrency can fully occupy the pool. Worker callbacks
// live on SchedulerWorkerService (separate port) to avoid that starvation.
// fastdllm_serve also implements this service's Submit / Poll / Generate.
// ---------------------------------------------------------------------------
service SchedulerService {
    // Submit a new generation request
    rpc Submit(GenerateRequest) returns (SubmitResponse);
    // Poll for request status / results
    rpc Poll(PollRequest) returns (PollResponse);
    // Blocking unary generate: server holds the call open until the request
    // reaches a terminal status (COMPLETED or ERROR), then returns the final
    // result. fastdllm_serve implements this; sangam returns UNIMPLEMENTED.
    rpc Generate(GenerateRequest) returns (GenerateResponse);
    // Export collected metrics to disk (CSVs + plots)
    rpc ExportMetrics(ExportMetricsRequest) returns (ExportMetricsResponse);
    // Reset collected metrics in preparation for a fresh benchmark phase
    rpc ResetMetrics(ResetMetricsRequest) returns (ResetMetricsResponse);
    // Report scheduler worker registration state for readiness checks
    rpc GetSchedulerStatus(GetSchedulerStatusRequest) returns (GetSchedulerStatusResponse);
}

// ---------------------------------------------------------------------------
// Scheduler Worker Service — bound to a separate port (scheduler_port + 1).
// Workers connect here for registration and event callbacks. Sized small
// because traffic is bounded by `num_workers × few-concurrent-RPCs`.
// ---------------------------------------------------------------------------
service SchedulerWorkerService {
    // Workers call this at startup to register themselves
    rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
    // Workers report completed prefill/decode batches plus per-request outcomes
    rpc ReportBatchMetrics(BatchMetricsReport) returns (BatchMetricsAck);
    // Prefill workers report deferred KV transfer completion/failure
    rpc ReportKVTransfer(KVTransferReport) returns (KVTransferAck);
}

// ---------------------------------------------------------------------------
// Prefill Worker Service — runs forward pass, holds KV cache
// ---------------------------------------------------------------------------
service PrefillWorkerService {
    // Enqueue a prefill request (returns immediately)
    rpc EnqueuePrefill(EnqueuePrefillRequest) returns (EnqueuePrefillResponse);
    // Trigger deferred KV transfer to an assigned decode worker
    rpc TriggerKVTransfer(TriggerKVTransferRequest) returns (TriggerKVTransferResponse);
    // Drain the waiting queue and return all unstarted requests (for work redistribution)
    rpc ReturnQueuedPrefills(ReturnQueuedPrefillsRequest) returns (ReturnQueuedPrefillsResponse);
}

// ---------------------------------------------------------------------------
// Decode Worker Service — receives KV cache, runs iterative decoding
// ---------------------------------------------------------------------------
service DecodeWorkerService {
    // Receive KV cache from prefill worker via NCCL
    rpc ReceiveKVCache(ReceiveKVCacheRequest) returns (ReceiveKVCacheResponse);
    // Enqueue a decode request (returns immediately)
    rpc EnqueueDecode(EnqueueDecodeRequest) returns (EnqueueDecodeResponse);
    // Free stored KV cache and state for a request
    rpc FreeDecodeState(FreeDecodeStateRequest) returns (FreeDecodeStateResponse);
}

// ---------------------------------------------------------------------------
// Worker Management Service — lifecycle operations for dynamic workers
// ---------------------------------------------------------------------------
service WorkerManagementService {
    // Convert an in-process worker between prefill and decode roles
    rpc ConvertPhase(ConvertPhaseRequest) returns (ConvertPhaseResponse);
}

// ---------------------------------------------------------------------------
// Colocated Worker Service — does both prefill and decode on same GPU
// ---------------------------------------------------------------------------
service ColocatedWorkerService {
    // Enqueue a request for prefill + decode (returns immediately)
    rpc EnqueueRequest(EnqueueColocatedRequest) returns (EnqueueColocatedResponse);
}

// ---------------------------------------------------------------------------
// Message definitions
// ---------------------------------------------------------------------------

// --- Scheduler messages ---

message SamplingParameters {
    float temperature = 1;
    string unmasking_strategy = 2;         // random | conf_threshold | conf_quota | conf_dynamic
    optional float confidence_threshold = 3;
    optional float dynamic_unmask_factor = 4;
    optional int32 fixed_unmask_quota = 5;
}

message GenerateRequest {
    repeated int64 prompt_token_ids = 1;
    int32 gen_length = 2;
    optional int64 request_seed = 4;
    SamplingParameters sampling_parameters = 10;
    reserved 3, 5, 6, 7, 8, 9;
    reserved "block_length", "temperature", "unmasking_strategy", "confidence_threshold", "dynamic_unmask_factor", "fixed_unmask_quota";
}

message SubmitResponse {
    string request_id = 1;
}

message PollRequest {
    string request_id = 1;
}

message PollResponse {
    string status = 1;            // PENDING, PREFILLING, DECODING, COMPLETED, ERROR
    repeated int64 output_token_ids = 2;
    int32 num_forward_evals = 3;
    string error_message = 4;
    // Server-side wall-clock (sangam) or monotonic (fastdllm_serve) timestamps,
    // in seconds. Use them as deltas (start - arrival = queue, complete - start =
    // execute); the two servers use different clocks so absolute values are not
    // directly comparable across backends or with client time.
    optional double server_arrival_time = 5;
    optional double server_start_time = 6;
    optional double server_complete_time = 7;
}

// Terminal response from the blocking Generate RPC. Same fields as a
// terminal PollResponse, so client-side timestamp handling stays unified.
message GenerateResponse {
    string request_id = 1;
    string status = 2;             // COMPLETED or ERROR
    repeated int64 output_token_ids = 3;
    int32 num_forward_evals = 4;
    string error_message = 5;
    optional double server_arrival_time = 6;
    optional double server_start_time = 7;
    optional double server_complete_time = 8;
}

message RegisterWorkerRequest {
    string worker_id = 1;
    string worker_type = 2;       // "prefill" or "decode"
    string address = 3;           // host:port for gRPC
    int32 dist_rank = 4;          // torch.distributed rank
    optional int32 max_pages = 5;
    optional int32 page_size = 6;
    bool is_conversion = 7;
    int32 gpu_id = 8;             // physical CUDA device id on this host
}

message RegisterWorkerResponse {
    bool success = 1;
}

// --- Scheduler callback messages ---

enum BatchPhase {
    BATCH_PHASE_PREFILL = 0;
    BATCH_PHASE_DECODE = 1;
    BATCH_PHASE_MIXED = 2;
}

message BatchRequestUpdate {
    string request_id = 1;
    int32 block_index = 2;
    bool success = 3;
    repeated int64 updated_sequence = 4;
    int32 num_unmasked_tokens = 5;
    int32 num_forward_evals_in_batch_phase = 6;
    double prefill_duration = 7;
    double prefill_queue_wait_duration = 8;
    optional double kv_transfer_duration = 9;
    double decode_duration = 10;
    double decode_queue_wait_duration = 11;
    int32 num_layers = 12;
    int32 num_kv_heads = 13;
    int32 head_dim = 14;
    int32 seq_length = 15;
    bool block_completed = 16;
    BatchPhase request_phase = 17;
}

message BatchMetricsReport {
    string worker_id = 1;
    string worker_type = 2;       // "prefill", "decode", "colocated"
    int32 batch_size = 3;
    int32 prompt_len = 4;
    int32 gen_len = 5;
    double batch_start_time = 6;
    double batch_end_time = 7;
    int32 kv_total_pages = 8;
    int32 kv_used_pages = 9;
    int32 kv_free_pages = 10;
    int32 num_unmasked_tokens = 11;
    BatchPhase batch_phase = 12;
    repeated BatchRequestUpdate request_updates = 13;
    WorkerStateSnapshot worker_state_after = 14;
    double sampling_duration = 15;
    optional double batch_op_attn_time = 16;
    optional double batch_op_mlp_time = 17;
    optional double batch_op_qkv_time = 18;
}

message BatchMetricsAck {
    bool success = 1;
}

message KVTransferReport {
    string worker_id = 1;
    string request_id = 2;
    int32 block_index = 3;
    bool success = 4;
    double transfer_start_time = 5;
    double transfer_end_time = 6;
    optional string error_message = 7;
    WorkerStateSnapshot worker_state_after = 8;
}

message KVTransferAck {
    bool success = 1;
}

enum WorkerState {
    WORKER_STATE_UNSPECIFIED = 0;
    WORKER_STATE_IDLE = 1;
    WORKER_STATE_QUEUED = 2;
    WORKER_STATE_BUSY = 3;
}

message WorkerStateSnapshot {
    WorkerState state = 1;
    double timestamp = 2;
    int32 waiting_queue_depth = 3;
    int32 active_batch_size = 4;
    int32 kv_total_pages = 5;
    int32 kv_used_pages = 6;
    int32 kv_free_pages = 7;
    int32 deficit_tokens = 8;
}

message ExportMetricsRequest {}

message ExportMetricsResponse {
    bool success = 1;
    string output_dir = 2;
}

message ResetMetricsRequest {}

message ResetMetricsResponse {
    bool success = 1;
}

message GetSchedulerStatusRequest {}

message GetSchedulerStatusResponse {
    int32 num_prefill_workers = 1;
    int32 num_decode_workers = 2;
    int32 num_colocated_workers = 3;
    bool ready_for_requests = 4;
}

// --- Prefill worker messages ---

message StreamingDecodeTarget {
    string worker_id = 1;
    int32 dst_rank = 2;
    string worker_address = 3;
}

message EnqueuePrefillRequest {
    string request_id = 1;
    repeated int64 sequence_ids = 2;
    int32 block_start = 3;
    int32 block_end = 4;
    int32 block_index = 5;
    int32 total_generation_blocks = 20;
    optional int64 request_seed = 9;
    SamplingParameters sampling_parameters = 18;
    StreamingDecodeTarget streaming_decode_target = 19;
    int32 mask_id = 14;
    double arrival_time = 15;
    double prefill_enqueue_time = 17;
    reserved 6, 7, 8, 10, 11, 12, 13, 16;
    reserved "temperature", "unmasking_strategy", "confidence_threshold", "dynamic_unmask_factor", "fixed_unmask_quota";
}

message EnqueuePrefillResponse {
    bool success = 1;
    WorkerStateSnapshot accepted_state = 2;
}

message TriggerKVTransferRequest {
    string request_id = 1;
    int32 block_index = 2;
    string decode_worker_id = 3;
    int32 decode_dst_rank = 4;
    string decode_worker_address = 5;
    EnqueueDecodeRequest decode_request = 6;
}

message TriggerKVTransferResponse {
    bool success = 1;
}

message ReturnQueuedPrefillsRequest {}

message ReturnQueuedPrefillsResponse {
    repeated EnqueuePrefillRequest requests = 1;
}

// --- Decode worker messages ---

message ReceiveKVCacheRequest {
    string request_id = 1;
    int32 src_rank = 2;           // prefill worker's torch.distributed rank
    // Metadata for pre-allocating receive buffers
    int32 num_layers = 3;
    int32 num_kv_heads = 4;
    int32 head_dim = 5;
    int32 seq_length = 6;
    int32 block_start = 9;
    int32 block_end = 10;
    int32 block_index = 11;
    repeated int64 sequence_ids = 12;
    optional int64 request_seed = 22;
    SamplingParameters sampling_parameters = 21;
    bool streaming = 23;
    bool auto_enqueue_decode = 24;
    int32 mask_id = 17;
    double arrival_time = 18;
    double decode_enqueue_time = 20;
    reserved 7, 8, 13, 14, 15, 16, 19;
    reserved "temperature", "unmasking_strategy", "confidence_threshold", "dynamic_unmask_factor", "fixed_unmask_quota";
}

message ReceiveKVCacheResponse {
    bool success = 1;
}

message EnqueueDecodeRequest {
    string request_id = 1;
    repeated int64 sequence_ids = 2;
    int32 block_start = 3;
    int32 block_end = 4;
    int32 block_index = 5;
    optional int64 request_seed = 6;
    SamplingParameters sampling_parameters = 15;
    int32 mask_id = 11;
    double arrival_time = 12;
    double decode_enqueue_time = 14;
    reserved 7, 8, 9, 10, 13;
    reserved "temperature", "unmasking_strategy", "confidence_threshold", "dynamic_unmask_factor", "fixed_unmask_quota";
}

message EnqueueDecodeResponse {
    bool success = 1;
    WorkerStateSnapshot accepted_state = 2;
}

message FreeDecodeStateRequest {
    string request_id = 1;
}

message FreeDecodeStateResponse {
    bool success = 1;
}

message ConvertPhaseRequest {
    string target_type = 1;
}

message ConvertPhaseResponse {
    bool success = 1;
    repeated EnqueuePrefillRequest returned_prefill_requests = 2;
    repeated EnqueueDecodeRequest returned_decode_requests = 3;
    string error_message = 4;
}

// --- Colocated worker messages ---

message EnqueueColocatedRequest {
    string request_id = 1;
    repeated int64 sequence_ids = 2;
    int32 block_start = 3;
    int32 block_end = 4;
    int32 block_index = 5;
    int32 total_generation_blocks = 16;
    optional int64 request_seed = 6;
    SamplingParameters sampling_parameters = 15;
    int32 mask_id = 11;
    double arrival_time = 12;  // original request submit time, for priority ordering
    double prefill_enqueue_time = 14;
    reserved 7, 8, 9, 10, 13;
    reserved "temperature", "unmasking_strategy", "confidence_threshold", "dynamic_unmask_factor", "fixed_unmask_quota";
}

message EnqueueColocatedResponse {
    bool success = 1;
    WorkerStateSnapshot accepted_state = 2;
}
